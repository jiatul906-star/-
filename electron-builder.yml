appId: com.ai-companion.app
productName: AI伴侣
directories:
  output: dist
files:
  - out/**/*
  - '!node_modules'
win:
  icon: resources/icon.ico
  sign: false
  target:
    - target: nsis
      arch: [x64]
electronDist: node_modules/electron/dist
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI 伴侣
  artifactName: AI伴侣 Setup ${version}.${ext}
