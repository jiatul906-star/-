appId: com.with-u.app
productName: WITH U
directories:
  output: dist
files:
  - out/**/*
  - '!node_modules'
extraResources:
  - from: python-dist/
    to: python/
    filter:
      - '**/*'
  - from: python-server/
    to: python-server/
    filter:
      - '**/*'
  - from: resources/default-characters/
    to: default-characters/
    filter:
      - '**/*'
win:
  icon: resources/icon.ico
  sign: false
  target:
    - target: nsis
      arch: [x64]
electronDist: node_modules/electron/dist
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WITH U
  artifactName: WITH U Setup ${version}.${ext}
  include: installer.nsh
