<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 伴侣 - UI 预览</title>
<style>
  :root {
    --bg: #FBF9F7;
    --card: #FFFFFF;
    --bubble-ai: #F5F3F1;
    --bubble-user: #FFE0D8;
    --accent: #E8927C;
    --text: #3C3C3C;
    --text-secondary: #999999;
    --shadow-bubble: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-panel: 0 4px 16px rgba(0,0,0,0.08);
    --shadow-window: 0 8px 32px rgba(0,0,0,0.12);
    --radius-bubble: 18px;
    --radius-window: 10px;
    --radius-input: 12px;
    --radius-panel: 12px;
    --radius-btn: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: #E8E4E0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    gap: 40px;
    flex-wrap: wrap;
    padding: 40px;
  }

  /* ========== 顶部切换按钮 ========== */
  .controls {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 100;
  }
  .controls button {
    padding: 8px 20px;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    background: white;
    color: var(--text);
    box-shadow: var(--shadow-bubble);
    transition: all 150ms ease-out;
  }
  .controls button.active {
    background: var(--accent);
    color: white;
  }

  /* ========== Level 1: 桌宠模式 ========== */
  .level1-scene {
    display: none;
    position: relative;
    width: 100%;
    height: 600px;
    background: linear-gradient(180deg, #E8E4E0 0%, #DDD8D2 100%);
    border-radius: 16px;
    overflow: hidden;
  }
  .level1-scene.show { display: block; }

  .desktop-pet {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 180px;
    background: linear-gradient(180deg, #F5D5C8 0%, #E8B8A8 100%);
    border-radius: 60px 60px 20px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    cursor: grab;
    transition: transform 100ms ease-out;
  }
  .desktop-pet:active { cursor: grabbing; transform: translateX(-50%) scale(0.95); }
  .desktop-pet .face {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .desktop-pet .eyes { display: flex; gap: 20px; }
  .desktop-pet .eye { width: 12px; height: 14px; background: #3C3C3C; border-radius: 50%; }
  .desktop-pet .mouth { width: 16px; height: 8px; border-bottom: 3px solid #3C3C3C; border-radius: 0 0 50% 50%; }

  /* 右键气泡 */
  .speech-bubble {
    position: absolute;
    bottom: 260px;
    left: calc(50% + 70px);
    background: white;
    padding: 12px 18px;
    border-radius: 18px;
    font-size: 14px;
    color: var(--text);
    box-shadow: var(--shadow-panel);
    opacity: 0;
    transform: translateY(8px);
    transition: all 200ms ease-out;
    white-space: nowrap;
  }
  .speech-bubble.show { opacity: 1; transform: translateY(0); }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid white;
  }

  /* 左键菜单 */
  .context-menu {
    position: absolute;
    background: white;
    border-radius: 12px;
    padding: 4px 0;
    box-shadow: var(--shadow-panel);
    opacity: 0;
    transform: scale(0.9);
    transition: all 150ms ease-out;
    pointer-events: none;
    min-width: 120px;
    font-size: 13px;
  }
  .context-menu.show { opacity: 1; transform: scale(1); pointer-events: auto; }
  .context-menu .item {
    padding: 8px 16px;
    cursor: pointer;
    color: var(--text);
    transition: background 100ms;
  }
  .context-menu .item:hover { background: var(--bubble-ai); }

  /* ========== Level 2: 聊天模式 ========== */
  .level2-scene {
    display: none;
    justify-content: center;
    align-items: center;
    width: 100%;
  }
  .level2-scene.show { display: flex; }

  .chat-window {
    width: 420px;
    background: var(--bg);
    border-radius: var(--radius-window);
    box-shadow: var(--shadow-window);
    overflow: hidden;
    position: relative;
  }

  /* 角色骑边框 */
  .pet-on-border {
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 100px;
    background: linear-gradient(180deg, #F5D5C8 0%, #E8B8A8 100%);
    border-radius: 35px 35px 10px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    z-index: 10;
    cursor: grab;
    transition: transform 300ms ease-out;
  }
  .pet-on-border .eyes { display: flex; gap: 10px; }
  .pet-on-border .eye { width: 7px; height: 8px; background: #3C3C3C; border-radius: 50%; position: relative; top: -4px; }
  .pet-on-border .mouth { width: 10px; height: 5px; border-bottom: 2px solid #3C3C3C; border-radius: 0 0 50% 50%; position: relative; top: 2px; }

  /* 顶栏 */
  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: var(--bg);
    border-bottom: 1px solid rgba(0,0,0,0.04);
    margin-top: 0;
  }
  .titlebar .avatar-small {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #F5D5C8, #E8B8A8);
    flex-shrink: 0;
  }
  .titlebar .name { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
  .titlebar .gear {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 16px;
    color: var(--text-secondary);
    transition: background 100ms;
    display: flex; align-items: center; justify-content: center;
  }
  .titlebar .gear:hover { background: var(--bubble-ai); }

  /* 主体：左侧栏 + 聊天区 */
  .chat-body { display: flex; height: 440px; }

  /* 左侧角色栏 */
  .char-sidebar {
    width: 60px;
    padding: 8px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    border-right: 1px solid rgba(0,0,0,0.04);
    overflow-y: auto;
  }
  .char-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #F5D5C8, #E8B8A8);
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 150ms;
    flex-shrink: 0;
    position: relative;
  }
  .char-avatar.active { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,146,124,0.2); }
  .char-avatar.add {
    background: var(--bubble-ai);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: var(--text-secondary);
    border: 2px dashed #DDD;
  }
  .char-avatar.add:hover { border-color: var(--accent); color: var(--accent); }

  /* 聊天消息区 */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  .messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    display: flex;
    gap: 8px;
    max-width: 85%;
    animation: msgIn 250ms ease-out;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.ai { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .msg .avatar-mini {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #F5D5C8, #E8B8A8);
    flex-shrink: 0;
  }
  .msg.user .avatar-mini { display: none; }

  .msg .bubble {
    padding: 10px 14px;
    border-radius: var(--radius-bubble);
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    box-shadow: var(--shadow-bubble);
  }
  .msg.ai .bubble { background: var(--bubble-ai); }
  .msg.user .bubble { background: var(--bubble-user); }

  .msg .time {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
    padding: 0 4px;
  }

  /* 输入区 */
  .input-area {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px 16px;
    background: var(--card);
    border-top: 1px solid rgba(0,0,0,0.04);
  }
  .input-area textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    background: transparent;
    min-height: 24px;
    max-height: 120px;
  }
  .input-area textarea::placeholder { color: var(--text-secondary); }
  .btn-send {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 100ms;
  }
  .btn-send:hover { transform: scale(1.05); }
  .btn-send:active { transform: scale(0.95); }

  /* ========== Level 3: 设置模式 ========== */
  .level3-scene {
    display: none;
    justify-content: center;
    align-items: center;
    width: 100%;
  }
  .level3-scene.show { display: flex; }

  .settings-window {
    width: 640px;
    background: var(--bg);
    border-radius: var(--radius-window);
    box-shadow: var(--shadow-window);
    overflow: hidden;
  }
  .settings-titlebar {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    background: var(--bg);
    border-bottom: 1px solid rgba(0,0,0,0.04);
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .settings-titlebar .close {
    margin-left: auto;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 16px;
    color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
  }
  .settings-titlebar .close:hover { background: var(--bubble-ai); }

  .settings-body { display: flex; height: 420px; }

  /* 左侧角色列表 */
  .settings-sidebar {
    width: 150px;
    padding: 12px;
    border-right: 1px solid rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
  }
  .settings-sidebar .section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 8px;
  }
  .char-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: var(--radius-btn);
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    transition: background 100ms;
  }
  .char-item:hover { background: var(--bubble-ai); }
  .char-item.active { background: var(--bubble-user); }
  .char-item .dot {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #F5D5C8, #E8B8A8);
    flex-shrink: 0;
  }
  .char-item.add-new {
    color: var(--accent);
    font-weight: 500;
  }
  .char-item.add-new .dot {
    background: var(--bubble-ai);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    color: var(--text-secondary);
  }
  .settings-sidebar .divider {
    height: 1px;
    background: rgba(0,0,0,0.04);
    margin: 4px 0;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border-radius: var(--radius-btn);
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    transition: all 100ms;
  }
  .nav-item:hover { background: var(--bubble-ai); color: var(--text); }

  /* 右侧设置面板 */
  .settings-content {
    flex: 1;
    padding: 16px 20px;
    overflow-y: auto;
  }
  .settings-content h3 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .settings-content .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }
  .form-group {
    margin-bottom: 14px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }
  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #E0DDD8;
    border-radius: var(--radius-btn);
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--card);
    outline: none;
    transition: border-color 100ms;
  }
  .form-group input:focus,
  .form-group textarea:focus {
    border-color: var(--accent);
  }
  .form-group textarea {
    resize: vertical;
    min-height: 60px;
  }
  .form-group .hint {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* ========== 标签 (Level 3 DIY 步骤) ========== */
  .step-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    background: var(--bubble-ai);
    border-radius: var(--radius-btn);
    padding: 3px;
  }
  .step-tab {
    flex: 1;
    text-align: center;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text-secondary);
    border: none;
    background: transparent;
    font-family: inherit;
    transition: all 150ms;
  }
  .step-tab.active {
    background: var(--card);
    color: var(--text);
    font-weight: 500;
    box-shadow: var(--shadow-bubble);
  }
</style>
</head>
<body>

<div class="controls">
  <button onclick="showLevel(1)" class="active" id="btn1">Level 1 · 桌宠</button>
  <button onclick="showLevel(2)" id="btn2">Level 2 · 聊天</button>
  <button onclick="showLevel(3)" id="btn3">Level 3 · 设置</button>
</div>

<!-- Level 1: 桌宠模式 -->
<div class="level1-scene show" id="l1">
  <div class="desktop-pet" id="pet" onclick="toggleMenu(event)">
    <div class="face">
      <div class="eyes">
        <div class="eye"></div><div class="eye"></div>
      </div>
      <div class="mouth"></div>
    </div>
  </div>
  <div class="speech-bubble" id="speech">你好呀～</div>
  <div class="context-menu" id="menu" style="bottom: 260px; left: calc(50% + 40px);">
    <div class="item" onclick="alert('摸摸头～')">👋 摸摸头</div>
    <div class="item" onclick="alert('喂食中...')">🍪 喂食</div>
    <div class="item" onclick="showLevel(2)">💬 展开聊天</div>
    <div class="item" onclick="showLevel(3)">⚙ 设置</div>
  </div>
</div>

<!-- Level 2: 聊天窗口 -->
<div class="level2-scene" id="l2">
  <div class="chat-window">
    <div class="pet-on-border" title="拖拽我～">
      <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
      <div class="mouth"></div>
    </div>
    <div class="titlebar" style="padding-top: 18px;">
      <div class="avatar-small"></div>
      <span class="name">小桃</span>
      <button class="gear" onclick="showLevel(3)" title="设置">⚙</button>
    </div>
    <div class="chat-body">
      <div class="char-sidebar">
        <div class="char-avatar active" title="小桃"></div>
        <div class="char-avatar" title="未命名的角色" style="background: linear-gradient(135deg, #C8DCF5, #A8C8E8);"></div>
        <div class="char-avatar add" title="新建角色">+</div>
      </div>
      <div class="chat-area">
        <div class="messages">
          <div class="msg ai">
            <div class="avatar-mini"></div>
            <div>
              <div class="bubble">你好呀！今天想聊些什么呢？</div>
              <div class="time">10:32</div>
            </div>
          </div>
          <div class="msg user">
            <div>
              <div class="bubble">今天天气真好</div>
              <div class="time">10:33</div>
            </div>
          </div>
          <div class="msg ai">
            <div class="avatar-mini"></div>
            <div>
              <div class="bubble">是呀～阳光暖暖的，心情都变好了呢 ☀️</div>
              <div class="time">10:33</div>
            </div>
          </div>
          <div class="msg user">
            <div>
              <div class="bubble">要不要出去走走</div>
              <div class="time">10:34</div>
            </div>
          </div>
          <div class="msg ai">
            <div class="avatar-mini"></div>
            <div>
              <div class="bubble">好呀！不过你要带上我哦 <span style="opacity:0.5">▍</span></div>
              <div class="time">10:34</div>
            </div>
          </div>
        </div>
        <div class="input-area">
          <textarea rows="1" placeholder="输入消息..."></textarea>
          <button class="btn-send">↑</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Level 3: 设置窗口 -->
<div class="level3-scene" id="l3">
  <div class="settings-window">
    <div class="settings-titlebar">
      设置
      <button class="close" onclick="showLevel(2)">✕</button>
    </div>
    <div class="settings-body">
      <div class="settings-sidebar">
        <div class="section-label">角色</div>
        <div class="char-item active">
          <div class="dot"></div> 小桃
        </div>
        <div class="char-item">
          <div class="dot" style="background:linear-gradient(135deg,#C8DCF5,#A8C8E8)"></div> 未命名
        </div>
        <div class="char-item add-new">
          <div class="dot">+</div> 新建角色
        </div>
        <div class="divider"></div>
        <div class="nav-item">🎨 外观</div>
        <div class="nav-item">ℹ️ 关于</div>
      </div>
      <div class="settings-content">
        <h3>编辑角色 · 小桃</h3>
        <p class="subtitle">自定义角色的外观、性格和声音</p>

        <div class="step-tabs">
          <button class="step-tab active">外表</button>
          <button class="step-tab">灵魂</button>
          <button class="step-tab">声音</button>
        </div>

        <div class="form-group">
          <label>角色名称</label>
          <input type="text" value="小桃">
        </div>
        <div class="form-group">
          <label>角色头像 / 立绘</label>
          <div style="width:100px;height:100px;border-radius:12px;border:2px dashed #DDD;background:var(--bubble-ai);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:12px;cursor:pointer;">
            点击上传
          </div>
          <div class="hint">支持 JPG/PNG，建议 1:1 比例</div>
        </div>
        <div class="form-group">
          <label>性格描述</label>
          <textarea placeholder="用自然语言描述角色性格，AI 会自动理解。例如：温柔体贴、偶尔毒舌、喜欢吐槽天气..."></textarea>
        </div>

        <div class="form-group" style="border-top:1px solid rgba(0,0,0,0.04);padding-top:14px;margin-top:8px;">
          <label>AI API 地址</label>
          <input type="text" placeholder="https://api.openai.com/v1">
          <div class="hint">支持 OpenAI 兼容接口</div>
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input type="password" placeholder="sk-...">
        </div>
        <div class="form-group">
          <label>模型</label>
          <select>
            <option>gpt-4o</option>
            <option>gpt-4o-mini</option>
            <option>claude-3.5-sonnet</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function showLevel(n) {
  document.querySelectorAll('#l1,#l2,#l3').forEach(el => el.classList.remove('show'));
  document.querySelectorAll('#btn1,#btn2,#btn3').forEach(b => b.classList.remove('active'));
  document.getElementById('l'+n).classList.add('show');
  document.getElementById('btn'+n).classList.add('active');
}

function toggleMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('menu');
  const bubble = document.getElementById('speech');
  menu.classList.toggle('show');
  if (!menu.classList.contains('show')) {
    bubble.classList.remove('show');
  }
}

// 右键气泡
document.getElementById('pet').addEventListener('contextmenu', function(e) {
  e.preventDefault();
  const bubble = document.getElementById('speech');
  const menu = document.getElementById('menu');
  menu.classList.remove('show');
  bubble.textContent = ['你好呀～', '今天天气不错呢', '要不要聊聊天？', '嘻嘻，被你发现了'][Math.floor(Math.random()*4)];
  bubble.classList.add('show');
  setTimeout(() => bubble.classList.remove('show'), 3000);
});

// 点击空白关闭菜单
document.addEventListener('click', function() {
  document.getElementById('menu').classList.remove('show');
});

// Level 2: 角色拖拽离开回到 Level 1
document.querySelector('.pet-on-border').addEventListener('dblclick', function() {
  showLevel(1);
});
</script>
